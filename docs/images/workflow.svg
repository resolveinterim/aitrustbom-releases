<rect x="175" y="962" width="250" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="300" y="985" text-anchor="middle" fill="#0f172a">📄 9. Export approved evidence</text>
<text x="300" y="1005" text-anchor="middle" fill="#0f172a">(developer, approver or CI job)</text>
<rect x="175" y="1062" width="250" height="56" rx="10" fill="#fae8ff" stroke="#c026d3" stroke-width="2.5"/>

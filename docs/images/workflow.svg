<text x="300" y="85" text-anchor="middle" fill="#0f172a">📦 1. Install and initialise</text>
<text x="300" y="105" text-anchor="middle" fill="#0f172a">(once)</text>
<rect x="175" y="162" width="250" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="300" y="195" text-anchor="middle" fill="#0f172a">🔍 2. Scan</text>
<rect x="175" y="262" width="250" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="300" y="285" text-anchor="middle" fill="#0f172a">✍️ 3. Declare in</text>
<text x="300" y="305" text-anchor="middle" fill="#0f172a">trust/manual.yml</text>
<rect x="175" y="362" width="250" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="300" y="385" text-anchor="middle" fill="#0f172a">🔄 Re-scan</text>
<text x="300" y="405" text-anchor="middle" fill="#0f172a">(to include declarations)</text>
<rect x="175" y="462" width="250" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
<text x="300" y="485" text-anchor="middle" fill="#0f172a">🚦 4. Check locally</text>
<text x="300" y="505" text-anchor="middle" fill="#0f172a">(gate)</text>
<rect x="175" y="562" width="250" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="300" y="595" text-anchor="middle" fill="#0f172a">📝 6. Request approval</text>
<rect x="175" y="662" width="250" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="300" y="695" text-anchor="middle" fill="#0f172a">🔀 7. Open pull request</text>
<rect x="175" y="762" width="250" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
<text x="300" y="785" text-anchor="middle" fill="#0f172a">✅ Check remotely</text>
<text x="300" y="805" text-anchor="middle" fill="#0f172a">(GitHub gate on the PR)</text>
<rect x="175" y="862" width="250" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
<text x="300" y="885" text-anchor="middle" fill="#0f172a">🛡️ 8. Trust approver</text>

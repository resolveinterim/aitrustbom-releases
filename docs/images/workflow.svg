<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1200" viewBox="0 0 880 1200" font-family="Segoe UI, Segoe UI Emoji, Arial, sans-serif" font-size="15" role="img" aria-labelledby="title desc">
<title id="title">AI TrustBOM pull-request workflow</title>
<desc id="desc">Set up once with trustbom init. A developer opens a pull request that adds or changes AI. The AI TrustBOM check fails and its comment says Not approved, Needs information, listing what changed, what is missing and whether trust/card.json is out of date. The developer fills the gaps in trust/manual.yml, scans, commits and pushes until the comment says Not approved, Ready for sign-off; if gaps remain they fill them again. The developer runs trustbom propose, commits and pushes; the first sign-off adds Trust's two decisions, --high-risk and --article-50. The check passes and the comment says Proposed, not approved. Trust, a code owner who is not the author, reviews and merges; changes requested go back to filling the gaps. Optionally, trustbom github-rules apply makes GitHub block the merge until a code owner other than the author approves. Once merged, the default branch holds the Approved version. The team shares it with the paid export, answer and publish commands; export --draft is free and watermarked. The customer checks the pack with trustbom verify, free and offline. The next AI change starts again at step 2, and the comment says Not approved (stale) until Trust signs it off again.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="880" height="1200" fill="#fff"/>

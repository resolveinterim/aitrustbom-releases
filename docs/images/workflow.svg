<text x="300" y="1105" text-anchor="middle" fill="#0f172a">verifies the pack</text>
<text x="300" y="1154" text-anchor="middle" font-size="13" font-style="italic" fill="#475569">If the record changes later, start again at 2. Scan</text><rect x="440" y="12" width="190" height="116" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="452" y="32" font-size="13" font-weight="600" fill="#0f172a">Key</text><rect x="452" y="44" width="18" height="14" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="478" y="56" font-size="13" fill="#0f172a">Your developers</text><rect x="452" y="64" width="18" height="14" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="478" y="76" font-size="13" fill="#0f172a">AI TrustBOM gate check</text><rect x="452" y="84" width="18" height="14" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="478" y="96" font-size="13" fill="#0f172a">Your Trust approver</text><rect x="452" y="104" width="18" height="14" rx="3" fill="#fae8ff" stroke="#c026d3" stroke-width="2"/><text x="478" y="116" font-size="13" fill="#0f172a">Pack recipients</text>

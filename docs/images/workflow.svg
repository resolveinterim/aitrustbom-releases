<path d="M300,418 V462" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<path d="M300,518 V562" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<path d="M300,618 V662" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<path d="M300,718 V762" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<path d="M300,818 V862" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<path d="M300,918 V962" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<path d="M300,1018 V1062" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<text x="308" y="444" text-anchor="start" font-size="12" font-style="italic" fill="#475569">push</text>
<text x="308" y="644" text-anchor="start" font-size="12" font-style="italic" fill="#475569">push</text>
<text x="308" y="844" text-anchor="start" font-size="12" font-style="italic" fill="#475569">merged</text>
<path d="M150,490 H110 V400 H148" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr)"/>
<text x="102" y="445" text-anchor="middle" font-size="12" font-style="italic" fill="#475569" transform="rotate(-90 102 445)">gaps remain</text>
<path d="M150,790 H70 V380 H148" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr)"/>
<text x="62" y="585" text-anchor="middle" font-size="12" font-style="italic" fill="#475569" transform="rotate(-90 62 585)">changes requested</text>
<rect x="150" y="62" width="300" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="300" y="85" text-anchor="middle" fill="#0f172a">📦 1. Set up once</text>
<text x="300" y="105" text-anchor="middle" font-size="13" fill="#0f172a">trustbom init, name Trust reviewers, push</text>
<rect x="150" y="162" width="300" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="300" y="185" text-anchor="middle" fill="#0f172a">🔀 2. Open a pull request</text>
<text x="300" y="205" text-anchor="middle" font-size="13" fill="#0f172a">as usual; it adds or changes AI</text>
<rect x="150" y="262" width="300" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
<text x="300" y="285" text-anchor="middle" fill="#0f172a">🚦 Check fails and comments</text>
<text x="300" y="305" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Not approved — Needs information</text>
<rect x="150" y="362" width="300" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="300" y="385" text-anchor="middle" fill="#0f172a">✍️ 3. Fill the gaps</text>
<text x="300" y="405" text-anchor="middle" font-size="13" fill="#0f172a">in trust/manual.yml, then scan, commit, push</text>
<rect x="150" y="462" width="300" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
<text x="300" y="485" text-anchor="middle" fill="#0f172a">🚦 Comment updates</text>
<text x="300" y="505" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Not approved — Ready for sign-off</text>
<rect x="150" y="562" width="300" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="300" y="585" text-anchor="middle" fill="#0f172a">📝 4. Propose</text>
<text x="300" y="605" text-anchor="middle" font-size="13" fill="#0f172a">trustbom propose, commit, push</text>
<rect x="150" y="662" width="300" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
<text x="300" y="685" text-anchor="middle" fill="#0f172a">🚦 Check passes</text>
<text x="300" y="705" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Proposed, not approved</text>
<rect x="150" y="762" width="300" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
<text x="300" y="785" text-anchor="middle" fill="#0f172a">🛡️ 5. Trust signs off</text>
<text x="300" y="805" text-anchor="middle" font-size="13" fill="#0f172a">reviews and merges; not the author</text>
<rect x="150" y="862" width="300" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
<text x="300" y="885" text-anchor="middle" font-weight="600" fill="#0f172a">✅ Approved</text>
<text x="300" y="905" text-anchor="middle" font-size="13" fill="#0f172a">the approved version is on the default branch</text>
<rect x="150" y="962" width="300" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
<text x="300" y="985" text-anchor="middle" fill="#0f172a">📤 6. Share with customers</text>
<text x="300" y="1005" text-anchor="middle" font-size="13" fill="#0f172a">export, answer, publish (paid)</text>
<rect x="150" y="1062" width="300" height="56" rx="10" fill="#fae8ff" stroke="#c026d3" stroke-width="2.5"/>
<text x="300" y="1085" text-anchor="middle" fill="#0f172a">🧾 7. Customer verifies</text>
<text x="300" y="1105" text-anchor="middle" font-size="13" fill="#0f172a">trustbom verify, free and offline</text>
<path d="M450,290 H600" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="600" y="238" width="260" height="104" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<g font-size="13" fill="#0f172a"><text x="612" y="260" font-weight="600">The comment lists</text><text x="612" y="282">• what changed, with file and line</text><text x="612" y="302">• what is missing, each with a 'Next:' step</text><text x="612" y="322">• trust/card.json if it is out of date</text></g>
<path d="M450,590 H600" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="600" y="542" width="260" height="96" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<g font-size="13" fill="#0f172a"><text x="612" y="564" font-weight="600">First sign-off only</text><text x="612" y="584">add Trust's two decisions:</text><text x="612" y="604" font-family="Consolas, Menlo, monospace" font-size="12">--high-risk yes|no</text><text x="612" y="624" font-family="Consolas, Menlo, monospace" font-size="12">--article-50 yes|no</text></g>
<path d="M600,790 H452" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<text x="525" y="782" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">enforces</text>
<rect x="600" y="730" width="260" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6 4"/>
<g font-size="13" fill="#0f172a"><text x="612" y="752" font-size="15">🔒 Require sign-off (optional)</text><text x="612" y="774" font-family="Consolas, Menlo, monospace" font-size="12">trustbom github-rules apply</text><text x="612" y="796">GitHub blocks the merge until a</text><text x="612" y="816">code owner other than the author</text><text x="612" y="836">approves it</text></g>
<path d="M450,990 H600" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="600" y="954" width="260" height="72" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<g font-size="13" fill="#0f172a"><text x="612" y="976">Run by a developer, Trust or a CI job.</text><text x="612" y="996"><tspan font-family="Consolas, Menlo, monospace" font-size="12">export --draft</tspan> is free and</text><text x="612" y="1016">watermarked as not approved.</text></g>
<text x="300" y="1154" text-anchor="middle" font-size="13" font-style="italic" fill="#475569">The next AI change starts again at 2. Until Trust signs it off,</text>
<text x="300" y="1174" text-anchor="middle" font-size="13" font-style="italic" fill="#475569">the comment says Not approved (stale).</text>
<rect x="640" y="12" width="230" height="136" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="652" y="32" font-size="13" font-weight="600" fill="#0f172a">Key</text><rect x="652" y="44" width="18" height="14" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="678" y="56" font-size="13" fill="#0f172a">Your team</text><rect x="652" y="64" width="18" height="14" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="678" y="76" font-size="13" fill="#0f172a">AI TrustBOM check and status</text><rect x="652" y="84" width="18" height="14" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="678" y="96" font-size="13" fill="#0f172a">Trust (a different person)</text><rect x="652" y="104" width="18" height="14" rx="3" fill="#fae8ff" stroke="#c026d3" stroke-width="2"/><text x="678" y="116" font-size="13" fill="#0f172a">Customer (the buyer or auditor)</text><rect x="652" y="124" width="18" height="14" rx="3" fill="#fff" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 2"/><text x="678" y="136" font-size="13" fill="#0f172a">Optional (dashed)</text>
</svg>
